<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0b" />

    <title>fluxproto-light docs</title>
    <meta name="description" content="Documentation for fluxproto-light — a 5G/4G protocol load and conformance tester. One Go binary that drives NGAP, Diameter, SBI, REST, and PFCP from declarative YAML flows." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="fluxproto-light docs" />
    <meta property="og:description" content="5G/4G protocol load and conformance tester. NGAP · Diameter · SBI · REST · PFCP — declarative YAML, one Go binary." />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="fluxproto-light docs" />
    <meta name="twitter:description" content="5G/4G protocol load and conformance tester. Declarative YAML flows, one Go binary." />
    <meta name="twitter:image" content="/og-image.svg" />

    <script>
      // Apply theme synchronously before React hydrates to avoid FOUC.
      // Default is dark.
      (function () {
        try {
          var stored = localStorage.getItem('fluxdocs-theme');
          var theme = stored || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
